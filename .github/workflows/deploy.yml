name: Deploy

# Continuous deployment: on every push to main, build fresh container images,
# push them to GitHub Container Registry (GHCR), then SSH into the VM and
# restart the stack with the new images.
on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual "Run workflow" button too

# Never let two deploys run at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push site (React SPA + nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dogppelganger-site:latest

      - name: Build & push model (FastAPI)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dogppelganger-model:latest
          # The first build stage installs PyTorch and exports CLIP to ONNX,
          # which takes minutes. Caching it in GitHub Actions means that layer
          # is reused on every later deploy and only rebuilt when
          # requirements-ml.txt actually changes.
          cache-from: type=gha,scope=model
          cache-to: type=gha,scope=model,mode=max

  deploy:
    name: Deploy to VM over SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and restart the stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/dogppelganger
            git pull --ff-only
            docker compose pull
            # Schema before code. main.py's create_all() builds missing tables
            # but never adds a column to one that already exists, and the
            # Postgres data directory is a named volume that survives every
            # deploy — so without this the new image queries columns the live
            # database hasn't got. The script is idempotent: once applied it
            # prints "nothing to do" and exits 0.
            docker compose run --rm model python scripts/migrate_schema.py
            docker compose up -d
            docker image prune -f
