name: CI

# Runs on every push and pull request. Fast checks only — no deployment.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: Backend (install, compile, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # requirements-dev.txt is test-only (pytest, httpx). It is deliberately
      # not installed into the image — see backend/Dockerfile.
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Byte-compile (syntax check)
        run: python -m compileall backend/main.py backend/app backend/tests backend/scripts
      - name: Game tests (engine + API + WebSocket)
        run: pytest
        working-directory: backend
