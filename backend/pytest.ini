[pytest]
testpaths = tests
# Every test that touches the game engine is async; marking each one adds noise.
asyncio_mode = auto
# Each test gets its own event loop, so a room's game loop can't leak into the
# next test.
asyncio_default_fixture_loop_scope = function
addopts = -q
filterwarnings =
    # numpy 2.x on Apple's Accelerate BLAS raises these on perfectly ordinary
    # float32 matmuls: the vectorised kernel leaves the FP exception flags set
    # even though the result is exact (verified against float64 to 5e-9). It
    # only happens on macOS — CI is Ubuntu/OpenBLAS — and it is filtered here
    # rather than suppressed in app/ml so a *real* NaN still surfaces loudly.
    ignore:(divide by zero|overflow|invalid value) encountered in matmul:RuntimeWarning
