# Maps the Upgrade header so WebSocket connections proxy correctly.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the SPA. Unknown paths fall back to index.html so React Router
    # can handle client-side routes like /forum/:id on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The dog corpus, straight off the read-only `dogdata` volume — 5,239
    # public, immutable photos that have no business going through Python.
    # Filenames are content-addressed by slug and never change, so they can be
    # cached for a year. See DATA_STORAGE.md 2.2.
    #
    # `=404` and not the SPA fallback: a missing dog must be a 404, not a
    # 200 of index.html that an <img> renders as a broken icon.
    #
    # No `alias` here on purpose. The volume is mounted at
    # /usr/share/nginx/html/dogs, so the server-level `root` already resolves
    # /dogs/512/x.jpg to the right file — and `alias` combined with
    # `try_files` is a long-standing nginx trap (the $uri is resolved against
    # the root rather than the alias), which would 404 every dog.
    location /dogs/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Proxy API + WebSocket calls to the FastAPI backend ('model' service).
    location /api/ {
        proxy_pass http://model:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
