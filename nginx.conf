# Maps the Upgrade header so WebSocket connections proxy correctly.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the SPA. Unknown paths fall back to index.html so React Router
    # can handle client-side routes like /forum/:id on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + WebSocket calls to the FastAPI backend ('model' service).
    location /api/ {
        proxy_pass http://model:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
