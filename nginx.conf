server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the SPA. Unknown paths fall back to index.html so React Router
    # can handle client-side routes like /forum/:id on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the Flask backend ('model' service on the compose network).
    location /api/ {
        proxy_pass http://model:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
