<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The app badge: 🐶 on the coral circle with the ink ring, same mark as
         the header. SVG is what modern browsers pick; the .ico is the fallback
         for older ones. Both are generated by backend/scripts/make_brand_assets.py. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>dogppelganger — find the dog you already are</title>
    <meta
      name="description"
      content="Upload a photo, get the dog you'd be. Share it, chat with fellow pups, and play match games with the community."
    />
    <meta property="og:title" content="dogppelganger — find the dog you already are" />
    <meta
      property="og:description"
      content="Human → dog matching, a shared gallery, forums, DMs and multiplayer games. Pure playful chaos."
    />
    <meta property="og:type" content="website" />
    <!-- Relative on purpose: the site has no domain yet, only an IP that can
         change, and a hardcoded absolute URL would rot. Some scrapers won't
         resolve a relative og:image — make it absolute once there's a domain. -->
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
